name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check

  backend:
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: terabits_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: terabits_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U terabits_test -d terabits_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://terabits_test:local-test-only@127.0.0.1:5433/terabits_test
      TEST_DATABASE_URL: postgresql://terabits_test:local-test-only@127.0.0.1:5433/terabits_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run db:validate
      - run: npm run check
